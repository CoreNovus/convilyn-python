[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convilyn"
dynamic = ["version"]
description = "Official Convilyn client SDK — file conversion, agentic workflows, community library"
readme = "docs/README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Convilyn", email = "support@convilyn.com" },
]
keywords = [
    "convilyn",
    "ai",
    "agent",
    "workflow",
    "file-conversion",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
#
# **The lowest versions these floors allow carried no published advisory when
# this file was last changed**, and that includes the packages the listed ones
# bring in. A repository check resolves this table, and each extra below, at
# the lowest versions it allows and fails on an advisory in any resolved
# package; it runs on changes to this package and before a release. Two
# limits: it says nothing
# about releases above a floor, which are not capped, and a release that has no
# wheel is checked for its own advisories but not for what it would bring in.
#
# That is why some entries name a package this SDK never imports. Each is
# marked "transitive" with the dependency that brings it in: when that
# dependency raises its own floor past the advisory, the entry can go.
dependencies = [
    # 0.25.2 is the first release on httpcore 1.x. Below it, the h11 floor
    # further down would pair httpx with an httpcore it was never released with.
    "httpx>=0.25.2,<1.0.0",
    # 2.4.0 fixes GHSA-mr82-8j83-vxmv (regular-expression denial of service in
    # e-mail validation).
    "pydantic>=2.4.0,<3.0.0",
    "click>=8.0.0,<9.0.0",
    # `convilyn.graphs.types` builds its state on its TypedDict, which pydantic
    # accepts below Python 3.12; 4.6.1 is what pydantic 2.4 itself requires.
    "typing-extensions>=4.6.1",
    # Transitive, not imported by convilyn; brought in by httpx, which sets no
    # floor on any of them. anyio 4.14.2 fixes GHSA-5p39-cfhj-2xmp; certifi
    # 2026.10.18 fixes GHSA-6q48-6c7w-9gw2; idna 3.15 fixes GHSA-65pc-fj4g-8rjx.
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "idna>=3.15",
    # Transitive, not imported by convilyn; brought in by httpcore (httpx's
    # transport). 0.16.0 fixes GHSA-vqfr-h8mv-ghfj.
    "h11>=0.16.0",
]

# Offline conversion (`convilyn.local`). One extra per format family, so a user
# who wants PDF → Markdown does not also install a presentation parser and, with
# it, lxml. The composites are declared in terms of the leaves rather than
# repeating their contents, so there is one list per package, not two.
#
# `csv`, `txt` and Markdown rendering need NOTHING — they work on a bare
# install, which is worth knowing before reaching for an extra.
#
# Two things these cannot cover, and both are stated in the docs rather than
# papered over: `pptx` pulls Pillow transitively (python-pptx depends on it),
# and LibreOffice / Calibre are desktop applications that no extra can install.
#
# **Each floor is the lowest release clear of published advisories**, and a
# repository check holds it there. Lower floors would be wrong in the direction
# that matters: `Pillow>=11.0` and `pypdf>=6.0` would let a user of this
# published package install versions carrying, respectively, three GHSAs (one
# of them a decompression bomb) and twenty-two DoS advisories. A published SDK
# is where a low floor does the most damage, not the least.
#
# There are no upper caps: the convention is a floor.
#
# The same check covers what each parser pulls in, so some entries below are
# transitive (not imported by convilyn through that extra); each names the
# dependency that should carry the floor:
#
# - pypdf 6.21.4 fixes GHSA-5849-834g-hvw5.
# - cryptography 50.0.0 fixes GHSA-g6cj-pr64-35w5. Transitive: pdfminer-six
#   (which pdfplumber requires) accepts cryptography 36.
# - Pillow 13.0.0 fixes GHSA-22hg-r758-rrw9. Direct in `images`; transitive in
#   `pdf` (through pdfplumber) and in `pptx` (through python-pptx), which both
#   accept Pillow 9.
# - lxml 6.1.0 fixes GHSA-vfmq-68hx-4jfw. Transitive: python-docx and
#   python-pptx both accept lxml 4.
[project.optional-dependencies]
pdf = ["pdfplumber>=0.11.9", "pypdf>=6.21.4", "cryptography>=50.0.0", "Pillow>=13.0.0"]
docx = ["python-docx>=1.0.0", "lxml>=6.1.0"]
pptx = ["python-pptx>=1.0.0", "lxml>=6.1.0", "Pillow>=13.0.0"]
xlsx = ["openpyxl>=3.1.0"]
xml = ["defusedxml>=0.7.0"]
images = ["Pillow>=13.0.0"]
documents = ["convilyn[pdf,docx,pptx,xlsx,xml]"]
all = ["convilyn[documents,images]"]
# The MCP transport, and deliberately NOT part of `all`. `all` means "every
# offline format"; this means "expose those formats over a protocol". They are
# orthogonal, which is what makes `convilyn[all,mcp]` read correctly instead of
# redundantly. Pinned >=2.0 because 2.x renamed FastMCP to MCPServer and the
# server module uses the new name — supporting both would be a compatibility
# branch, and nobody holds a 1.x lock on this package yet. 2.2.0 fixes
# GHSA-5h93-6whr-6q8j.
#
# The rest are transitive, not imported by convilyn; mcp brings each of them in
# and accepts a release an advisory names (cryptography arrives through pyjwt):
# cryptography 50.0.0 fixes GHSA-g6cj-pr64-35w5; httpx2 2.12.0 fixes
# GHSA-8xx6-hgc6-gc2m; opentelemetry-api 1.45.2 fixes GHSA-mf5v-w3w3-f6cg;
# pyjwt 2.15.0 fixes GHSA-42vr-xj54-vc7v; python-multipart 0.0.31 fixes
# GHSA-v9pg-7xvm-68hf; starlette 1.3.1 fixes GHSA-82w8-qh3p-5jfq.
mcp = [
    "mcp>=2.2.0,<3.0.0",
    "cryptography>=50.0.0",
    "httpx2>=2.12.0",
    "opentelemetry-api>=1.45.2",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
]
# Ready-made graphs for LangGraph (`convilyn.graphs`), and outside `all` for the
# same reason `mcp` is: it is not a format. It is for someone who already builds
# on that framework, and nobody else should pay for its dependency tree.
#
# Each floor is the lowest release clear of a published advisory, including the
# two this package never imports: an extra is what puts them in a user's
# environment. langgraph 1.2.14 requires a langgraph-sdk past
# GHSA-fvww-7h3r-vfhp, and 1.2.16 stops a graph placed inside another from
# running its finished parallel steps again when resumed, which `fanout`
# promises; langgraph-checkpoint 4.1.1 fixes GHSA-fjqc-hq36-qh5p (unsafe JSON
# deserialization when loading saved state), and 4.3.0 is what langgraph 1.2.16
# requires; langsmith 0.8.18 fixes GHSA-f4xh-w4cj-qxq8. langchain-core is what
# langgraph requires. orjson, which langgraph-sdk and langsmith pull in, 3.11.6
# fixes GHSA-hx9q-6w63-j58v (no depth limit when serialising nested values).
# jsonschema checks collected values against their field's schema; no advisory
# names it, and 4.18 is the first release built on `referencing`, which the
# Draft 2020-12 validator needs. langchain supplies the agent a use case answers
# with; 1.3.9 fixes GHSA-gr75-jv2w-4656 (path traversal in its file-search
# middleware, which this package never uses).
#
# requests and urllib3 are transitive, not imported by convilyn: langsmith
# accepts requests 2.0, and requests accepts urllib3 1.26. requests 2.33.0
# fixes GHSA-gc5v-m9x4-r6x2; urllib3 2.8.0 fixes GHSA-8988-9cw3-xx77. pyyaml is
# transitive too: langchain-core accepts pyyaml 5.3, and 5.4 fixes
# GHSA-8q59-q68h-6hv4.
graphs = [
    "langgraph>=1.2.16",
    "langchain-core>=1.4.7",
    "langgraph-checkpoint>=4.3.0",
    "langsmith>=0.8.18",
    "orjson>=3.11.6",
    "jsonschema>=4.18.0",
    "langchain>=1.3.9",
    "requests>=2.33.0",
    "urllib3>=2.8.0",
    "pyyaml>=5.4",
]
# Vector search in `convilyn.rag`'s SQLite store, and nothing else; imported only
# when a vector is searched. Outside `all` for the same reason as `mcp`: it is
# not a document format.
rag = ["numpy>=1.26"]

[project.urls]
Homepage = "https://convilyn.com"
Documentation = "https://docs.convilyn.com"
Issues = "https://github.com/CoreNovus/convilyn-python/issues"
Repository = "https://github.com/CoreNovus/convilyn-python"
"Source Code" = "https://github.com/CoreNovus/convilyn-python"
Changelog = "https://github.com/CoreNovus/convilyn-python/blob/main/CHANGELOG.md"

[project.scripts]
convilyn = "convilyn.cli.main:cli"

# Dev tooling lives in a PEP 735 dependency group (uv-native: `uv sync`
# installs it by default). Kept out of the wheel/sdist METADATA.
[dependency-groups]
dev = [
    "mcp>=2.2.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.22.0",
    "ruff==0.17.5",
    # The `typecheck` gate's checker. Specifier deliberately identical to
    # every other declaration of it: a cross-file agreement check compares
    # specifier STRINGS, and a new
    # spelling here would be a new disagreement it may not accept. The exact
    # version is pinned by uv.lock, which `--locked` enforces.
    "pyright>=1.1.350",
    # Mirrors [project.optional-dependencies]. `uv sync --locked` installs the
    # project's dependencies plus this group and NOT its extras, so without the
    # mirror the engine's tests cannot import their parsers — they would skip,
    # and the coverage floor would then be measuring code nothing exercised.
    # A green run over un-run code is the failure this guards against.
    #
    # Kept in agreement with the extras by a repository check, so the
    # duplication is machine-checked rather than remembered.
    "pdfplumber>=0.11.9",
    "pypdf>=6.21.4",
    "cryptography>=50.0.0",
    "python-docx>=1.0.0",
    "lxml>=6.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "defusedxml>=0.7.0",
    "Pillow>=13.0.0",
    "httpx2>=2.12.0",
    "opentelemetry-api>=1.45.2",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "langgraph>=1.2.16",
    "langchain-core>=1.4.7",
    "langgraph-checkpoint>=4.3.0",
    "langsmith>=0.8.18",
    "orjson>=3.11.6",
    "jsonschema>=4.18.0",
    "langchain>=1.3.9",
    "requests>=2.33.0",
    "urllib3>=2.8.0",
    "pyyaml>=5.4",
    "numpy>=1.26",
    # Test-only: the PDF and image fixtures are BUILT, not committed, so the
    # suite needs a writer for formats no extractor produces.
    "reportlab>=4.1.0",
]

[tool.hatch.version]
path = "src/convilyn/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/convilyn"]

[tool.hatch.build.targets.sdist]
# Ship CHANGELOG + examples + docs in the sdist so source-install workflows
# (e.g. `pip install --no-binary :all:`) get the user-facing repo surface. The
# wheel intentionally stays lean — README is bundled in METADATA (rendered on
# PyPI); LICENSE is picked up via `license-files = ["LICENSE"]` per PEP 639;
# CHANGELOG ships in the sdist (see `include` below). The files excluded below
# are for contributors working on the package, not for its users.
#
# Invariant — SHIPPED == SCANNED: every surface shipped here that carries prose
# is covered by the repository's vocabulary check, this file included. The
# `tests/` suite is not user-facing, so it is not shipped.
include = [
    "src/convilyn",
    "examples",
    "docs",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "AGENT.md",
    # Whole-subtree exclusion (not the single-level `docs/internal/*`) so a
    # nested internal doc can never leak into the published sdist.
    "docs/internal",
    # hatchling's sdist would otherwise ship the repository's `.gitignore`,
    # which describes the repository rather than this package, into an
    # immutable public artifact.
    ".gitignore",
]

[tool.pyright]
# Read by the `typecheck` gate (`uv run --locked pyright src`) and by an
# editor, so both agree.
#
# The mode is PINNED rather than inherited: pyright's default
# typeCheckingMode has moved before now, so leaving it unstated would make
# this gate's strictness a property of whichever pyright the lock resolves.
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
# `.md` is out of scope for BOTH ruff gates, stated here so a manual
# `ruff format` and the CI gate see the same tree.
#
# ruff 0.16 formats python code fences inside markdown; `ruff check` does NOT
# scan markdown at all. These READMEs ship inside the published package, so
# whether to format their fences was decided rather than left to a default.
#
# **Decided (2026-08-19): markdown fences ARE formatted.** Measured on this
# package before flipping: 3 files change, all of it trailing-comment
# realignment. The feared class (deliberately one-line multi-name imports
# exploded one-per-line) does not occur here.
#
# What this buys is narrow, and worth stating so nobody over-reads a green run:
# consistency, not correctness. A formatter has no opinion on whether a sample
# CALLS A FUNCTION THAT EXISTS — four real defects were once measured in one
# README that `292 files reformatted` was silent on. The check that
# catches those here is `tests/integration/test_examples_syntax.py`, which
# parses every QUICKSTART python fence and resolves its `from convilyn import`
# names against the real public surface.

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The offline engine is generated from its upstream source and never edited
# here. Its enums stay `str, Enum`: `StrEnum` changes what `str(member)`
# returns, so it is not a change to make in a generated copy. E501 for the same
# reason: the formatter does not split a string literal, and a long message in
# the source arrives here as is.
"src/convilyn/local/_engine/**" = ["UP042", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage is measured AND enforced on every pytest invocation so
# regressions get caught locally before CI. Threshold is line ≥ 80%
# (`--cov-fail-under=80`).
# Branch coverage is enabled (`--cov-branch`) to surface uncovered
# conditionals that line coverage hides; the threshold is line-only
# because branch behaviour varies per Python minor version.
addopts = "--cov=src/convilyn --cov-branch --cov-fail-under=80 --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/convilyn"]
branch = true
# Omit zero-logic modules so they don't dilute the percentage: the
# generated `_version.py` only declares __version__; the package
# `__init__.py` is re-exports only. Both are exercised by every
# import-based test indirectly.
omit = [
    "src/convilyn/_version.py",
    "src/convilyn/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Hard floor: any drop below 80% line coverage fails pytest. Current
# measurement sits at ~93%, leaving 13 points of
# headroom — future contributors can land coverage-neutral PRs
# without triggering the gate, but a sweeping regression will fire it.
fail_under = 80
